name: Collect player stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-player-stats.yml"
      - "scripts/collect-player-stats.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: player-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: https://iiijyotbqwkxvalrdlxc.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_3rkI2Xm9uWqFDdPTjkArEA_tfFIhwMb
      STATS_COLLECTOR_TOKEN: ${{ secrets.STATS_COLLECTOR_TOKEN }}
      PLAYWRIGHT_HEADLESS: "false"
      SCRAPE_ATTEMPTS: "3"
      STAT_READY_TIMEOUT_MS: "120000"
      REGISTRATION_CONCURRENCY: "2"
    steps:
      - name: Check collector secret
        shell: bash
        run: |
          if [ -z "$STATS_COLLECTOR_TOKEN" ]; then
            echo "::error::Add the STATS_COLLECTOR_TOKEN repository secret"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum -- npm run collect-stats
